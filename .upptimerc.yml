# Upptime configuration — see https://upptime.js.org/docs/configuration

owner: codbex # Your GitHub organization or username, where this repository lives
repo: upptime-monitoring # The name of this repository

sites:
  - name: codbex Website
    url: https://www.codbex.com/
  - name: codbex Platform EU1
    url: https://platform.eu1.codbex.com/actuator/health
  - name: codbex Auth EU1
    url: https://auth.eu1.codbex.com/auth/health

status-website:
  # No custom domain — served via GitHub Pages at https://codbex.github.io/upptime-monitoring
  # If you later add a custom domain, replace the `baseUrl` line with a `cname:` line instead.
  baseUrl: /upptime-monitoring
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: codbex Status
  introTitle: "**codbex Status** — uptime monitoring for codbex services, powered by Upptime."
  introMessage: This is the open-source status page for [codbex](https://www.codbex.com/), powered by [Upptime](https://github.com/upptime/upptime). No server required — just GitHub Actions, Issues, and Pages.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
